name: Build APK

on:
  push:
    branches: [hermes]
  workflow_dispatch:
    inputs:
      channel:
        description: Canal du moteur Hermes (locked = version de runtime.lock)
        type: choice
        options: [locked, stable, canary]
        default: locked
      version:
        description: Version précise du moteur (vide = la plus récente du canal)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANNEL_INPUT: ${{ inputs.channel || 'locked' }}
  VERSION_INPUT: ${{ inputs.version || '' }}
  # Numéro de build publié (tag hermes-fr-N et versionCode). À augmenter à chaque publication.
  RELEASE_NUMBER: '6'

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk || true
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Download the official Hermes Android runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gpgv gnupg binutils dpkg patchelf zstd >/dev/null
          if [ "$CHANNEL_INPUT" = locked ]; then
            . ./runtime.lock
            CHANNEL="$HERMES_RUNTIME_CHANNEL"; VERSION="${VERSION_INPUT:-$HERMES_RUNTIME_VERSION}"
          else
            CHANNEL="$CHANNEL_INPUT"; VERSION="$VERSION_INPUT"
          fi
          echo "runtime: channel=$CHANNEL version=${VERSION:-latest}"
          scripts/ci_run.sh fetch python3 scripts/fetch_payload.py --channel "$CHANNEL" --version "$VERSION" --out build/deb
          cat build/deb/meta.json

      - name: Ajouter bash et git (paquets Termux officiels)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/ci_run.sh shell python3 scripts/fetch_shell.py \
            --payload-root build/deb/root/data/data/com.termux/files/usr/lib/hermes-agent

      - name: Inspect runtime layout
        run: |
          ROOT=build/deb/root/data/data/com.termux/files/usr/lib/hermes-agent
          du -sh "$ROOT"/* || true
          find "$ROOT" -maxdepth 2 | sort | head -60
          cat "$ROOT/bin/hermes" || true
          cat "$ROOT/app/install-stamp.json" || true
          {
            echo "deb: $(cat build/deb/meta.json | tr -d '\n')"
            du -sh "$ROOT"/* "$ROOT"/tools/* 2>/dev/null
            echo "--- tools depth 5"
            find "$ROOT/tools" -maxdepth 7 -type d | sed "s|$ROOT/||" | head -40
            echo "--- bin/hermes"
            grep -E '^(PYTHON|REPO|SITE)=' "$ROOT/bin/hermes" || true
          } > build/layout.txt
          echo "::notice title=runtime layout::$(sed 's/%/%25/g' build/layout.txt | awk '{printf "%s%%0A", $0}')"

      - name: Resolve upstream source revision
        id: upstream
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          stamp = pathlib.Path("build/deb/root/data/data/com.termux/files/usr/lib/hermes-agent/app/install-stamp.json")
          data = json.loads(stamp.read_text()) if stamp.is_file() else {}
          meta = json.loads(pathlib.Path("build/deb/meta.json").read_text())
          print(f"commit={data.get('commit') or ''}")
          print(f"version={data.get('display_version') or data.get('base_version') or meta['version']}")
          print(f"deb_version={meta['version']}")
          PY

      - name: Check out upstream source (dashboard web UI)
        uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.upstream.outputs.commit || 'main' }}
          path: upstream
          fetch-depth: 1

      # Le dépôt amont est passé à pnpm (pnpm-lock.yaml, Node >= 26, version de pnpm figée dans pm/lock.json).
      - name: Node pour le tableau de bord amont (pnpm)
        if: hashFiles('upstream/pnpm-lock.yaml') != ''
        uses: actions/setup-node@v5
        with:
          node-version-file: upstream/.nvmrc

      - name: Build dashboard web UI
        working-directory: upstream
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PUPPETEER_SKIP_DOWNLOAD: '1'
          HUSKY: '0'
          LEFTHOOK: '0'
          CI: 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            PNPM_VERSION=$(node -p "require('./pm/lock.json').packages.pnpm.version")
            echo "node $(node --version), pnpm $PNPM_VERSION"
            npm install -g "pnpm@$PNPM_VERSION" --no-audit --no-fund
            ../scripts/ci_run.sh web-deps node scripts/build/node-deps.mjs --source "$PWD" --workspace web
            ../scripts/ci_run.sh web-build pnpm --dir web run build
          else
            npm ci --workspace web --include-workspace-root --no-audit --no-fund \
              || npm ci --no-audit --no-fund
            ../scripts/ci_run.sh web-build npm run build --workspace web
          fi
          test -f hermes_cli/web_dist/index.html

      - name: Relocate runtime for the app
        run: |
          scripts/ci_run.sh relocate python3 scripts/relocate_payload.py \
            --deb-root build/deb/root \
            --web-dist upstream/hermes_cli/web_dist \
            --meta build/deb/meta.json \
            --runpath \
            --out build/payload
          mkdir -p android/app/src/main/assets/payload
          cp build/payload/payload.zip build/payload/payload.json android/app/src/main/assets/payload/
          python3 -c "import json;m=json.load(open('build/payload/payload.json'));print(json.dumps({k:m[k] for k in ('payload_id','launcher','ld_library_path','path','node','cert_file','missing_libs','runpath','file_count','total_bytes','zip_bytes')},indent=1,ensure_ascii=False))" > build/payload-summary.txt
          echo "::notice title=payload::$(sed 's/%/%25/g' build/payload-summary.txt | awk '{printf "%s%%0A", $0}')"

      - name: Set up signing key
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_PASSPHRASE" ] || { echo "::error::secret SIGNING_PASSPHRASE absent"; exit 1; }
          d="$RUNNER_TEMP/signature"; install -d -m 700 "$d"
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$SIGNING_PASSPHRASE" -d ci/signing.tar.gz.gpg | tar -xz -C "$d"
          get() { grep -E "^$1=" "$d/keystore.properties" | head -1 | cut -d= -f2-; }
          SP="$(get storePassword)"; KA="$(get keyAlias)"; KP="$(get keyPassword)"
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          {
            echo "HERMES_ANDROID_KEYSTORE=$d/kmuse-release.jks"
            echo "HERMES_ANDROID_KEYSTORE_PASSWORD=$SP"
            echo "HERMES_ANDROID_KEY_ALIAS=$KA"
            echo "HERMES_ANDROID_KEY_PASSWORD=${KP:-$SP}"
          } >> "$GITHUB_ENV"
          echo "Clé de signature déchiffrée (contenu non affiché)."

      - name: Build APK
        working-directory: android
        env:
          HERMES_ANDROID_VERSION_CODE: ${{ env.RELEASE_NUMBER }}
          HERMES_ANDROID_VERSION_NAME: ${{ steps.upstream.outputs.version }}
        run: ../scripts/ci_run.sh gradle gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature (v1 + v2 + v3)
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          { echo "apksigner: $APKSIGNER"; "$APKSIGNER" verify --verbose --min-sdk-version 21 "$APK" 2>&1; echo "--- META-INF"; unzip -l "$APK" | grep META-INF; } > build/apksigner.txt || true
          echo "::notice title=apk signature::$(head -c 3000 build/apksigner.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          grep -qi "v1 scheme (JAR signing): true" build/apksigner.txt
          grep -qi "v2 scheme (APK Signature Scheme v2): true" build/apksigner.txt

      - name: Collect APK
        id: apk
        run: |
          mkdir -p dist
          NAME="hermes-android-${{ steps.upstream.outputs.version }}-${{ env.RELEASE_NUMBER }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          cp build/payload/payload.json dist/payload.json
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          ls -lh dist
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: payload
          path: build/payload/
          compression-level: 0
          retention-days: 3

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/
          compression-level: 0

    outputs:
      name: ${{ steps.apk.outputs.name }}
      version: ${{ steps.upstream.outputs.version }}
      deb_version: ${{ steps.upstream.outputs.deb_version }}
      commit: ${{ steps.upstream.outputs.commit }}

  smoke:
    name: Smoke test in an Android container
    needs: apk
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      IMAGE: termux/termux-docker:aarch64
      FINAL: /data/data/com.termux/files/home/sim
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: payload
          path: build/payload

      - name: Install the payload the way the app does
        run: |
          python3 scripts/install_payload.py --zip build/payload/payload.zip --manifest build/payload/payload.json \
            --dest sim/files/hermes-agent --final-root "$FINAL/files/hermes-agent"
          python3 scripts/smoke_env.py --manifest build/payload/payload.json \
            --root "$FINAL/files/hermes-agent" --files "$FINAL/files" --out sim/files/run.sh
          cp scripts/smoke_client.py scripts/smoke.sh sim/
          chmod -R a+rwX sim
          cat sim/files/run.sh

      - name: Probe the container
        run: |
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint /system/bin/sh "$IMAGE" -c 'id; uname -a; ls -ld /system /system/bin; ls -l /system/bin/sh; ls /data/data/com.termux/files/usr' > probe.txt 2>&1 || true
          echo "::notice title=container::$(head -c 3000 probe.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Run Hermes with the Termux prefix hidden
        run: |
          T=/data/data/com.termux/files/usr
          scripts/ci_run.sh smoke docker run --rm --user 1000:1000 \
            --tmpfs $T/lib:mode=0755,uid=1000,gid=1000 --tmpfs $T/etc:mode=0755,uid=1000,gid=1000 \
            --tmpfs $T/share:mode=0755,uid=1000,gid=1000 --tmpfs $T/libexec:mode=0755,uid=1000,gid=1000 \
            --tmpfs $T/tmp:mode=0777 \
            -v "$PWD/sim:$FINAL" --entrypoint /system/bin/sh "$IMAGE" "$FINAL/smoke.sh"
          test "$(grep -c SMOKE_OK build/logs/smoke.log)" = 2
          echo "::notice title=smoke output::$(tail -n 70 build/logs/smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  e2e:
    name: End-to-end test on an Android emulator
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true

      - name: Run the APK on an emulator (arm64 via native bridge)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 8G
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/e2e.sh

      - name: Report
        if: always()
        run: |
          if [ -f e2e/summary.txt ]; then
            echo "::notice title=e2e summary::$(sed 's/%/%25/g' e2e/summary.txt | awk '{printf "%s%%0A", $0}')"
          fi
          if [ -f e2e/logcat.txt ]; then
            echo "::notice title=e2e logcat (tail)::$(tail -n 80 e2e/logcat.txt | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi

      - name: Publish screenshots to the ci-e2e branch
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d e2e ] || exit 0
          cd e2e
          git init -q -b ci-e2e
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "e2e run ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-e2e

  release:
    name: Publish release
    needs: [apk, smoke]
    if: github.ref == 'refs/heads/hermes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('hermes-fr-{0}', env.RELEASE_NUMBER) }}
          name: ${{ format('Hermes (français) · build {0} (Hermes {1})', env.RELEASE_NUMBER, needs.apk.outputs.version) }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          prerelease: true
          files: |
            dist/*.apk
            dist/*.sha256
          body: |
            APK pour téléphone Android arm64 (Android 7.0 ou plus). Au premier lancement, le moteur se décompresse (1 à 3 minutes, environ 1 Go libre nécessaire).

            Moteur Hermes Agent : ${{ needs.apk.outputs.deb_version }} (commit amont ${{ needs.apk.outputs.commit }}). Testé dans un conteneur Android avant publication.
