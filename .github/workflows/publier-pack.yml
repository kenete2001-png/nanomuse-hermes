name: Publier le pack Hermes
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: pack, lfs: false }
      - name: Réassembler et vérifier
        run: |
          cat pack/part-* > hermes-pack-0.23.0-2bd378e-muse3-aarch64-ubuntu.tar.gz
          sha256sum -c pack/SHA256SUMS
          cp pack/SHA256SUMS hermes-pack-0.23.0-2bd378e-muse3-aarch64-ubuntu.tar.gz.sha256
      - name: Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view hermes-pack-0.23.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create hermes-pack-0.23.0 -R "$GITHUB_REPOSITORY" --target main --prerelease \
              --title "Pack Hermes 0.23.0 (Ubuntu 24.04 arm64)" --notes "Ubuntu 24.04.5 arm64 officiel + Hermes Agent officiel v0.23.0. Téléchargé par l'app au premier lancement."
          gh release upload hermes-pack-0.23.0 -R "$GITHUB_REPOSITORY" --clobber hermes-pack-0.23.0-2bd378e-muse3-aarch64-ubuntu.tar.gz hermes-pack-0.23.0-2bd378e-muse3-aarch64-ubuntu.tar.gz.sha256
